<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Gift Card | Neyrhyld Martin</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <a href="index.html" class="logo-link" aria-label="Inicio Neyrhyld Martin">
                        <img src="assets/logo_neymartin_estetica.png"
                            alt="Neyrhyld Martin Cosmetología y Estética Integrativa" class="logo-img">

                        <div class="brand-text">
                            <span class="brand-name">Neyrhyld Martin</span>
                            <span class="brand-subtitle">Estética Integrativa</span>
                        </div>
                    </a>
                </div>

                <ul class="nav-menu">
                    <li><a href="admin.html">Agenda</a></li>
                    <li><a href="giftcard-admin.html">Gift Cards</a></li>
                    <li><a href="login.html">Mi cuenta</a></li>
                </ul>

                <div class="hamburger" aria-label="Abrir menú de navegación">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>
    </header>

    <main class="panel-page">
        <section class="panel-card">
            <p class="section-kicker">Panel Administrativo</p>
            <h1>Validar Gift Card</h1>

            <p id="validateGiftcardAuthStatus">Validando permisos...</p>

            <div id="validateGiftcardContent" style="display: none;">

                <div class="admin-section giftcard-validator-section">
                    <h2><i class="fas fa-magnifying-glass"></i> Buscar Gift Card</h2>

                    <form id="validateGiftcardForm" class="admin-form">
                        <label for="giftcardCodeInput">Código Gift Card</label>
                        <input type="text" id="giftcardCodeInput" placeholder="Ej: NM-GC-20260603-ABC123" required>

                        <button type="submit" class="btn btn-primary">
                            Validar Gift Card
                        </button>
                    </form>

                    <p id="validateGiftcardMessage" class="admin-message"></p>
                </div>

                <div id="giftcardValidationResult" class="giftcard-validation-result" style="display: none;">
                    <!-- Resultado dinámico -->
                </div>

            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script type="module" src="validar-giftcard.js"></script>

</body>

</html>
